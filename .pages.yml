media:
  - name: article_images
    label: Article Images
    input: public/article-images
    output: /article-images
    extensions: [png, jpg, jpeg, webp, avif, gif, svg]
    categories: [image]
    rename: safe

content:
  - name: articles
    label: Blog Articles
    type: collection
    path: src/content/articles
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    exclude: ["_README.md"]
    view:
      fields: [title, pubDate, series, draft]
      primary: title
      sort: [pubDate, title]
      search: [title, deck, topics]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Headline
        type: string
        required: true

      - name: deck
        label: Short Introduction
        type: text
        required: true
        description: One or two sentences explaining the argument and why it matters.

      - name: series
        label: Article Series
        type: select
        required: true
        options:
          placeholder: Choose a series
          values:
            - name: whose-peers
              label: Whose Peers?
            - name: academic-autopsy
              label: Academic Autopsy
            - name: receipts-or-it-didnt-happen
              label: Receipts or It Didn't Happen
            - name: field-notes-from-the-other-side
              label: Field Notes From the Other Side
            - name: the-syllabus-left-this-out
              label: The Syllabus Left This Out
            - name: use-the-damn-tool
              label: Use the Damn Tool
            - name: dog-eared-dissent
              label: Dog-Eared Dissent
            - name: where-the-work-is
              label: Where the Work Is

      - name: topics
        label: Topics
        type: string
        list: true
        description: Add short search topics one at a time.

      - name: pubDate
        label: Publication Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: updatedDate
        label: Updated Date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd

      - name: author
        label: Author
        type: string
        default: Mabbit

      - name: description
        label: Search and Sharing Description
        type: text
        required: true
        description: About 150 characters explaining the article for search results and shared links.

      - name: coverImage
        label: Featured Article Graphic
        type: image
        options:
          media: article_images
          path: public/article-images
          extensions: [png, jpg, jpeg, webp, avif, gif, svg]
          rename: safe

      - name: coverAlt
        label: Featured Graphic Description
        type: text
        description: Describe what the graphic shows for readers who cannot see it.

      - name: coverCaption
        label: Featured Graphic Caption
        type: text
        description: Optional caption or source credit shown below the featured graphic.

      - name: socialImage
        label: Social Sharing Graphic
        type: image
        description: Optional separate landscape graphic for Facebook and other shared links.
        options:
          media: article_images
          path: public/article-images
          extensions: [png, jpg, jpeg, webp, avif]
          rename: safe

      - name: draft
        label: Keep as Draft
        type: boolean
        default: true
        description: Leave this on while writing. Turn it off when the article is ready to appear publicly.

      - name: placeholder
        type: boolean
        default: false
        hidden: true

      # The article body is an ordered stack of blocks. Add a block, pick its
      # type, and fill only the fields that type uses (the others stay blank).
      # Drag blocks to reorder. An image block lands exactly where it sits in
      # the stack. Rendering lives in src/components/blocks/.
      - name: blocks
        label: Article
        type: object
        list: true
        required: true
        description: >-
          Build the article block by block. Each block has a Type — pick it
          first, then fill only that type's fields.
        fields:
          - name: type
            label: Block type
            type: select
            required: true
            default: text
            options:
              values:
                - { name: text, label: "Text (Markdown)" }
                - { name: image, label: "Image" }
                - { name: callout, label: "Callout box" }
                - { name: quote, label: "Pull quote" }
                - { name: divider, label: "Divider" }

          # --- Text block, and the body of a Callout block ---
          - name: markdown
            label: "Body text — for Text and Callout blocks (Markdown)"
            type: rich-text
            options:
              format: markdown
              media: article_images
              path: public/article-images
              extensions: [png, jpg, jpeg, webp, avif, gif, svg]
              rename: safe
              switcher: true

          # --- Image block ---
          - name: image
            label: "Image file — Image block"
            type: image
            options:
              media: article_images
              path: public/article-images
              extensions: [png, jpg, jpeg, webp, avif, gif, svg]
              rename: safe
          - name: alt
            label: "Image description — Image block (for screen readers)"
            type: text
          - name: caption
            label: "Caption — Image block (optional)"
            type: string
          - name: size
            label: "Image width — Image block"
            type: select
            default: wide
            options:
              values:
                - { name: inline, label: "In the text column" }
                - { name: wide, label: "A little wider than the text" }
                - { name: full, label: "Full width" }
          - name: tilt
            label: "Image tilt — Image block"
            type: select
            default: left
            options:
              values:
                - { name: left, label: "Tilt left" }
                - { name: none, label: "Straight" }
                - { name: right, label: "Tilt right" }

          # --- Callout block ---
          - name: variant
            label: "Callout style — Callout block"
            type: select
            default: second-look
            options:
              values:
                - { name: second-look, label: "Second Look (chalkboard, for sourcing / fact-checks)" }
                - { name: warning, label: "Warning / caveat (hazard tape)" }
                - { name: plain, label: "Plain note" }
          - name: title
            label: "Callout heading — Callout block"
            type: string
          - name: eyebrow
            label: "Callout label — Callout block (optional, e.g. \"Worth Checking\")"
            type: string
          - name: steps
            label: "Citation-trail steps — Second Look callout (optional number)"
            type: number
          - name: source
            label: "Citation-trail endpoint — Second Look callout (optional)"
            type: string

          # --- Pull quote block ---
          - name: quote
            label: "Quote text — Pull quote block"
            type: text
          - name: attribution
            label: "Quote attribution — Pull quote block (optional)"
            type: string

          # --- Divider block ---
          - name: dividerStyle
            label: "Divider style — Divider block"
            type: select
            default: splatter
            options:
              values:
                - { name: splatter, label: "Spray-paint flecks" }
                - { name: rule, label: "Neon rule" }
                - { name: space, label: "Blank space" }
